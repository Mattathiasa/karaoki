name: karaoki
description: "Zemaoki - Ethiopian Karaoke Party Game"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.1

  # Routing
  go_router: ^13.0.0

  # Firebase
  firebase_core: ^2.24.2
  firebase_database: ^10.4.0
  firebase_auth: ^4.16.0

  # Audio playback
  just_audio: ^0.9.36

  # Mic capture + pitch detection
  audio_waveforms: ^1.0.4

  # QR code generation
  qr_flutter: ^4.1.0

  # Unique IDs
  uuid: ^4.2.1

  # Path provider
  path_provider: ^2.1.2

  # Permissions
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#1a1a1a"
    theme_color: "#1a1a1a"
  image_path: "assets/icon.png"
  min_sdk_android: 21
