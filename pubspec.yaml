name: karaoki
description: "Zemaoki - Ethiopian Karaoke Party Game"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.1

  # Routing
  go_router: ^13.0.0

  # Firebase
  firebase_core: ^2.24.2
  firebase_database: ^10.4.0
  firebase_auth: ^4.16.0

  # Audio playback
  just_audio: ^0.9.36

  # Mic capture + pitch detection
  audio_waveforms: ^1.0.4

  # QR code generation
  qr_flutter: ^4.1.0

  # Unique IDs
  uuid: ^4.2.1

  # Secure room code generation
  crypto: ^3.0.3

  # Path provider
  path_provider: ^2.1.2

  # Permissions
  permission_handler: ^11.1.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/lyrics/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0A0C10"
    theme_color: "#F7C13B"
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0A0C10"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
