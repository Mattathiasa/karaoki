document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

         <div style=\"font-size:40px;opacity:.5\">⌕<\u002Fdiv>\n                    <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-weight:700\">No songs match “zzqqx”<\u002Fdiv>\n                    <p style=\"margin:0 26px;font-size:13px;color:rgba(245,241,232,.5);line-height:1.5\">Check the spelling, or browse by genre instead.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"font-size:11.5px;font-weight:700;color:rgba(245,241,232,.5);margin-bottom:9px\">TRY INSTEAD<\u002Fdiv>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n                    <sc-for list=\"{{ categories }}\" as=\"c\" hint-placeholder-count=\"8\">\n                      <button sc-camel-on-click=\"{{ c.go }}\" style=\"padding:9px 14px;border-radius:999px;background:#1C1912;border:1px solid rgba(245,241,232,.13);box-shadow:0 16px 30px -20px rgba(0,0,0,.9),inset 0 1px 0 rgba(245,241,232,.09);font-size:12.5px;font-weight:700\">{{ c.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ s_micPerm }}\">\n                <div style=\"position:absolute;inset:0;background:rgba(4,3,8,.9);display:flex;flex-direction:column;justify-content:flex-end;padding:22px\">\n                  <div style=\"padding:22px;border-radius:26px;background:#17140E;border:1px solid rgba(245,241,232,.12)\">\n                    <div style=\"width:56px;height:56px;border-radius:18px;background:oklch(0.6 0.17 48/.3);display:flex;align-items:center;justify-content:center;font-size:26px\">🎤<\u002Fdiv>\n                    <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700;margin-top:16px;line-height:1.2\">Karaoki needs your microphone<\u002Fdiv>\n                    <p style=\"margin:9px 0 0;font-size:13.5px;color:rgba(245,241,232,.55);line-height:1.55\">We listen only while you are singing, to score pitch and timing. Nothing is recorded or uploaded.<\u002Fp>\n                    <button sc-camel-on-click=\"{{ nav.turnNow }}\" style=\"width:100%;margin-top:20px;padding:16px;border-radius:999px;background:linear-gradient(120deg,oklch(0.87 0.21 128),oklch(0.6 0.17 48));color:#0F0E0A;font-size:15px;font-weight:700\">Allow microphone<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ nav.lobby }}\" style=\"width:100%;margin-top:8px;padding:14px;font-size:13.5px;font-weight:700;color:rgba(245,241,232,.5)\">Not now — I'll just watch<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ s_micLost }}\">\n                <div style=\"position:absolute;inset:0;background:#100E0A;display:flex;flex-direction:column;padding:14px 20px 22px\">\n                  <div style=\"padding:13px 15px;border-radius:15px;background:oklch(0.48 0.17 22/.22);border:1px solid oklch(0.48 0.17 22/.5);display:flex;align-items:center;gap:11px\">\n                    <span style=\"font-size:17px\">⚠<\u002Fspan>\n                    <span style=\"flex:1\"><span style=\"display:block;font-size:13px;font-weight:700;color:oklch(0.72 0.2 22)\">Microphone disconnected<\u002Fspan><span style=\"display:block;font-size:11.5px;font-weight:600;color:rgba(245,241,232,.6)\">Scoring paused — the board is holding your slot<\u002Fspan><\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:16px;opacity:.35\">\n                    <div style=\"font-size:15px;font-weight:600;color:rgba(245,241,232,.3)\">{{ lyricPrev }}<\u002Fdiv>\n                    <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:29px;font-weight:700;line-height:1.2\">{{ lyricCur }}<\u002Fdiv>\n                    <div style=\"font-size:17px;font-weight:600;color:rgba(245,241,232,.4)\">{{ lyricNext }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"padding:16px;border-radius:18px;background:#1C1912;border:1px solid rgba(245,241,232,.13);box-shadow:0 22px 44px -26px rgba(0,0,0,.95),inset 0 1px 0 rgba(245,241,232,.09);text-align:center\">\n                    <div style=\"font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:rgba(245,241,232,.45)\">RECONNECTING<\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;justify-content:center;gap:5px;margin-top:12px\">\n                      <span style=\"width:9px;height:9px;border-radius:50%;background:oklch(0.48 0.17 22);animation:pulseGlow 1s infinite\"><\u002Fspan>\n                      <span style=\"width:9px;height:9px;border-radius:50%;background:rgba(245,241,232,.2)\"><\u002Fspan>\n                      <span style=\"width:9px;height:9px;border-radius:50%;background:rgba(245,241,232,.2)\"><\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ nav.singing }}\" style=\"margin-top:10px;padding:16px;border-radius:16px;background:#F5F1E8;color:#0F0E0A;font-size:15px;font-weight:700\">Reconnect microphone<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ s_weak }}\">\n                <div style=\"position:absolute;inset:0;background:#100E0A;display:flex;flex-direction:column;padding:14px 20px 22px\">\n                  <div style=\"padding:12px 14px;border-radius:14px;background:oklch(0.58 0.15 72/.2);border:1px solid oklch(0.58 0.15 72/.45);display:flex;align-items:center;gap:10px\">\n                    <span style=\"font-size:15px\">◔<\u002Fspan>\n                    <span style=\"flex:1;font-size:12.5px;font-weight:700;color:oklch(0.86 0.17 72)\">Weak connection — lyrics running locally, score syncs when you're back<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:16px\">\n                    <div style=\"font-size:15px;font-weight:600;color:rgba(245,241,232,.24)\">{{ lyricPrev }}<\u002Fdiv>\n                    <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:30px;font-weight:700;line-height:1.2\">{{ lyricCur }}<\u002Fdiv>\n                    <div style=\"font-size:17px;font-weight:600;color:rgba(245,241,232,.4)\">{{ lyricNext }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:8px\">\n                    <div style=\"flex:1;padding:12px;border-radius:14px;background:#17140E;border:1px solid rgba(245,241,232,.1);box-shadow:0 20px 38px -26px rgba(0,0,0,.95),inset 0 1px 0 rgba(245,241,232,.08);text-align:center\">\n                      <div style=\"font-family:'Space Mono',monospace;font-size:8.5px;color:rgba(245,241,232,.45)\">LATENCY<\u002Fdiv>\n                      <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-weight:700;color:oklch(0.86 0.17 72)\">840ms<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"flex:1;padding:12px;border-radius:14px;background:#17140E;border:1px solid rgba(245,241,232,.1);box-shadow:0 20px 38px -26px rgba(0,0,0,.95),inset 0 1px 0 rgba(245,241,232,.08);text-align:center\">\n                      <div style=\"font-family:'Space Mono',monospace;font-size:8.5px;color:rgba(245,241,232,.45)\">SCORE<\u002Fdiv>\n                      <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-weight:700;color:rgba(245,241,232,.4)\">syncing…<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ nav.singing }}\" style=\"margin-top:10px;padding:15px;border-radius:15px;background:#211D15;border:1px solid rgba(245,241,232,.15);box-shadow:0 16px 30px -20px rgba(0,0,0,.9),inset 0 1px 0 rgba(245,241,232,.1);font-size:14px;font-weight:700\">Keep singing anyway<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ s_dropped }}\">\n                <div style=\"position:absolute;inset:0;padding:16px 22px 26px;display:flex;flex-direction:column\">\n                  <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:21px;font-weight:700\">Friday Night Fire<\u002Fdiv>\n                  <div style=\"margin-top:16px;padding:15px;border-radius:17px;background:oklch(0.48 0.17 22/.18);border:1px solid oklch(0.48 0.17 22/.4);display:flex;align-items:center;gap:12px\">\n                    <span style=\"width:42px;height:42px;border-radius:14px;background:rgba(245,241,232,.09);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;opacity:.5\">D<\u002Fspan>\n                    <span style=\"flex:1\"><span style=\"display:block;font-size:13.5px;font-weight:700\">Dawit dropped out<\u002Fspan><span style=\"display:block;font-size:11.5px;font-weight:600;color:rgba(245,241,232,.55)\">Holding their queue slot for 0:47<\u002Fspan><\u002Fspan>\n                    <span style=\"font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:oklch(0.72 0.2 22)\">0:47<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:16px\">\n                    <sc-for list=\"{{ players }}\" as=\"p\" hint-placeholder-count=\"4\">\n                      <div style=\"display:flex;align-items:center;gap:12px;padding:11px;border-radius:16px;background:#17140E;border:1px solid rgba(245,241,232,.1);box-shadow:0 20px 38px -26px rgba(0,0,0,.95),inset 0 1px 0 rgba(245,241,232,.08)\">\n                        <span style=\"width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,oklch(0.62 0.12 196),oklch(0.62 0.17 128));font-size:15px;font-weight:700;color:#0F0E0A;display:flex;align-items:center;justify-content:center\">{{ p.initial }}<\u002Fspan>\n                        <span style=\"flex:1;font-size:13.5px;font-weight:700\">{{ p.name }}<\u002Fspan>\n                        <span style=\"font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;color:{{ p.readyColor }}\">{{ p.readyLabel }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:auto;display:flex;gap:9px\">\n                    <button sc-camel-on-click=\"{{ nav.queueScr }}\" style=\"flex:1;padding:15px;border-radius:15px;background:#211D15;border:1px solid rgba(245,241,232,.15);box-shadow:0 16px 30px -20px rgba(0,0,0,.9),inset 0 1px 0 rgba(245,241,232,.1);font-size:13.5px;font-weight:700\">Skip their slot<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ nav.lobby }}\" style=\"flex:1;padding:15px;border-radius:999px;background:linear-gradient(120deg,oklch(0.87 0.21 128),oklch(0.6 0.17 48));color:#0F0E0A;font-size:13.5px;font-weight:700\">Wait for them<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ s_roomFull }}\">\n                <div style=\"position:absolute;inset:0;padding:22px;display:flex;flex-direction:column;justify-content:center;text-align:center\">\n                  <div style=\"width:88px;height:88px;margin:0 auto;border-radius:28px;background:oklch(0.58 0.15 72/.22);border:1px solid oklch(0.58 0.15 72/.4);display:flex;align-items:center;justify-content:center;font-size:34px\">🚪<\u002Fdiv>\n                  <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:700;margin-top:20px\">This room is full<\u002Fdiv>\n                  <p style=\"margin:9px 20px 0;font-size:13.5px;color:rgba(245,241,232,.55);line-height:1.55\">Dorm 4B Late Show has 10 of 10 singers. You can watch on the board, or get a ping when a slot opens.<\u002Fp>\n                  <button sc-camel-on-click=\"{{ nav.bwait }}\" style=\"margin-top:24px;padding:16px;border-radius:999px;background:rgba(245,241,232,.07);border:1px solid rgba(245,241,232,.14);font-size:14.5px;font-weight:700\">Spectate on the board<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ nav.joinRoom }}\" style=\"margin-top:9px;padding:16px;border-radius:999px;background:linear-gradient(120deg,oklch(0.87 0.21 128),oklch(0.6 0.17 48));color:#0F0E0A;font-size:14.5px;font-weight:700\">Notify me when free<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ s_badCode }}\">\n                <div style=\"position:absolute;inset:0;overflow:auto;padding:14px 22px 26px\">\n                  <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:22px\">\n                    <button sc-camel-on-click=\"{{ nav.joinRoom }}\" style=\"font-size:19px;width:36px;height:36px;border-radius:12px;background:rgba(245,241,232,.06)\">←<\u002Fbutton>\n                    <span style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:700\">Join a room<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:11.5px;font-weight:700;color:oklch(0.72 0.2 22);margin-bottom:10px\">ROOM CODE<\u002Fdiv>\n                  <input value=\"{{ codeVal }}\" sc-camel-on-change=\"{{ onCode }}\" placeholder=\"KARA-0000\" style=\"width:100%;padding:20px;border-radius:18px;background:oklch(0.36 0.14 22/.16);border:1px solid oklch(0.48 0.17 22/.6);color:#F5F1E8;font-family:'Space Mono',monospace;font-size:30px;font-weight:700;letter-spacing:.14em;text-align:center\">\n                  <div style=\"display:flex;align-items:center;gap:8px;margin-top:10px;padding:12px 14px;border-radius:13px;background:oklch(0.48 0.17 22/.18);border:1px solid oklch(0.48 0.17 22/.4)\">\n                    <span style=\"font-size:14px\">⚠<\u002Fspan>\n                    <span style=\"font-size:12.5px;font-weight:700;color:oklch(0.72 0.2 22)\">No room with that code. Codes look like KARA-7821.<\u002Fspan>\n                  <\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ fillCode }}\" style=\"width:100%;margin-top:12px;padding:15px;border-radius:15px;background:#211D15;border:1px solid rgba(245,241,232,.15);box-shadow:0 16px 30px -20px rgba(0,0,0,.9),inset 0 1px 0 rgba(245,241,232,.1);font-size:13.5px;font-weight:700\">Autofill the demo code<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ submitCode }}\" style=\"width:100%;margin-top:9px;padding:16px;border-radius:999px;background:linear-gradient(120deg,oklch(0.87 0.21 128),oklch(0.6 0.17 48));color:#0F0E0A;font-size:15px;font-weight:700\">Try again<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ nav.qr }}\" style=\"width:100%;margin-top:14px;font-size:12px;font-weight:700;color:rgba(245,241,232,.45)\">Scan the QR code instead<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ s_unavailable }}\">\n                <div style=\"position:absolute;inset:0;padding:22px;display:flex;flex-direction:column\">\n                  <button sc-camel-on-click=\"{{ nav.details }}\" style=\"font-size:19px;width:36px;height:36px;border-radius:12px;background:rgba(245,241,232,.06)\">←<\u002Fbutton>\n                  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center\">\n                    <div style=\"width:124px;height:124px;margin:0 auto;border-radius:28px;background:{{ song.art }};display:flex;align-items:center;justify-content:center;font-size:36px;filter:saturate(.35)\">🚫<\u002Fdiv>\n                    <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700;margin-top:20px\">Not available in your region<\u002Fdiv>\n                    <p style=\"margin:9px 18px 0;font-size:13.5px;color:rgba(245,241,232,.55);line-height:1.55\">“Concrete Halo” isn't licensed here yet. Here are three close matches your room has sung before.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:8px\">\n                    <sc-for list=\"{{ searchHits }}\" as=\"sg\" hint-placeholder-count=\"3\">\n                      <button sc-camel-on-click=\"{{ sg.open }}\" style=\"display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:#17140E;border:1px solid rgba(245,241,232,.1);box-shadow:0 20px 38px -26px rgba(0,0,0,.95),inset 0 1px 0 rgba(245,241,232,.08);text-align:left\">\n                        <span style=\"width:46px;height:46px;border-radius:14px;flex:none;background:{{ sg.art }}\"><\u002Fspan>\n                        <span style=\"flex:1\"><span style=\"display:block;font-size:13.5px;font-weight:700\">{{ sg.title }}<\u002Fspan><span style=\"display:block;font-size:11.5px;font-weight:600;color:rgba(245,241,232,.45)\">{{ sg.artist }}<\u002Fspan><\u002Fspan>\n                        <span style=\"font-size:16px;color:oklch(0.87 0.21 128)\">+<\u002Fspan>\n                      <\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ s_noHistory }}\">\n                <div style=\"position:absolute;inset:0;padding:16px 22px 26px;display:flex;flex-direction:column\">\n                  <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700\">Your performances<\u002Fdiv>\n                  <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px\">\n                    <div style=\"width:100px;height:100px;border-radius:32px;border:2px dashed rgba(245,241,232,.16);display:flex;align-items:center;justify-content:center;font-size:38px;opacity:.55\">🎤<\u002Fdiv>\n                    <div>\n                      <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:700\">No performances yet<\u002Fdiv>\n                      <p style=\"margin:7px 22px 0;font-size:13px;color:rgba(245,241,232,.5);line-height:1.5\">Sing one song and we'll start tracking pitch, timing and your personal bests.<\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ nav.library }}\" style=\"padding:17px;border-radius:999px;background:linear-gradient(120deg,oklch(0.87 0.21 128),oklch(0.6 0.17 48));color:#0F0E0A;font-size:15.5px;font-weight:700\">Pick your first song<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ s_noBadges }}\">\n                <div style=\"position:absolute;inset:0;overflow:auto;padding:16px 22px 26px\">\n                  <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700\">Achievements<\u002Fdiv>\n                  <div style=\"margin-top:14px;padding:16px;border-radius:18px;background:rgba(245,241,232,.045);border:1px dashed rgba(245,241,232,.16);text-align:center\">\n                    <div style=\"font-size:30px;opacity:.5\">🔒<\u002Fdiv>\n                    <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:700;margin-top:8px\">Nothing unlocked yet<\u002Fdiv>\n                    <p style=\"margin:6px 10px 0;font-size:12.5px;color:rgba(245,241,232,.5);line-height:1.5\">Closest badge: <strong style=\"color:#F5F1E8\">First Song<\u002Fstrong> — one performance away.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px\">\n                    <sc-for list=\"{{ badges }}\" as=\"b\" hint-placeholder-count=\"6\">\n                      <div style=\"padding:14px;border-radius:17px;background:rgba(245,241,232,.03);border:1px solid rgba(245,241,232,.06);opacity:.45\">\n                        <div style=\"font-size:26px;margin-bottom:7px;filter:graysca
